<!doctype html>
<meta charset="utf-8">
<title>Synapse OG</title>
<!--
  Synapse OG card (1200x630). Self-contained, regenerable.
  Regenerate public/og.png:
    1) serve this dir:  python3 -m http.server 8792
    2) render at exact size:
       chromium --headless=new --hide-scrollbars --force-device-scale-factor=1 \
         --screenshot=../../public/og.png --window-size=1200,630 \
         http://localhost:8792/synapse-og.html
  Crest = public/synapse-logo.svg (router arrows) recolored to #8ab4ff for the dark card.
  Omni mark = website omni-logo-white.svg (inlined).
  Fonts: Inter (Google Fonts). Brand #2d6aff. Tagline: "Orchestrated intelligence".
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body { font-family: Inter, sans-serif; overflow: hidden; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: radial-gradient(120% 130% at 50% 38%, #1b2c62 0%, #0e1836 55%, #070c1d 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding-bottom: 44px;
  }
  /* subtle network mesh + brand glow */
  .mesh {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(120,150,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,150,255,.05) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(60% 60% at 50% 40%, #000 0%, transparent 75%);
            mask-image: radial-gradient(60% 60% at 50% 40%, #000 0%, transparent 75%);
  }
  .glow {
    position: absolute; top: 118px; left: 50%; transform: translateX(-50%);
    width: 420px; height: 420px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(45,106,255,.45) 0%, rgba(45,106,255,0) 70%);
    filter: blur(6px);
  }
  .frame { position: absolute; inset: 20px; border: 1.5px solid rgba(120,150,255,.18); border-radius: 18px; pointer-events: none; }
  .crest { width: 208px; height: 208px; margin-bottom: 6px; position: relative; filter: drop-shadow(0 8px 30px rgba(45,106,255,.5)); }
  .crest svg { width: 100%; height: 100%; display: block; }
  .word { font-weight: 800; font-size: 92px; line-height: 1; letter-spacing: -.035em; color: #fff; margin-top: 4px; }
  .sub  { font-weight: 600; font-size: 32px; color: #eaf0ff; margin-top: 18px; letter-spacing: -.01em; }
  .tag  { font-weight: 500; font-size: 19px; color: #8ea0cf; margin-top: 14px; letter-spacing: .04em; }
  .credit {
    position: absolute; left: 0; right: 0; bottom: 42px;
    display: flex; align-items: center; justify-content: center; gap: 11px;
    font-size: 22px; color: #7f8fb8; font-weight: 500;
  }
  .credit .omni { width: 26px; height: 26px; display: block; opacity: .92; }
  .credit .omni svg { width: 100%; height: 100%; display: block; }
</style>
<body>
  <div class="card">
    <div class="mesh"></div>
    <div class="glow"></div>
    <div class="frame"></div>
    <div class="crest">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Synapse">
        <path d="M 16,28 C 32,28 40,34 46,42" stroke="#8ab4ff" stroke-width="7" stroke-linecap="round" />
        <path d="M 58,58 C 68,64 76,70 82,70" stroke="#8ab4ff" stroke-width="7" stroke-linecap="round" />
        <path d="M 82,60 L 90,70 L 82,80" stroke="#8ab4ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 16,72 C 32,72 42,62 52,50 C 62,38 76,30 82,30" stroke="#c9d8ff" stroke-width="7" stroke-linecap="round" />
        <path d="M 82,20 L 90,30 L 82,40" stroke="#c9d8ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <div class="word">Synapse</div>
    <div class="sub">The unified AI gateway</div>
    <div class="tag">LLM · Embeddings · Images · MCP · STT · TTS · one endpoint</div>

</body>
